[mcu tool0]
canbus_uuid: d51bc39a53a0

[adxl345]
cs_pin: tool0: PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: x,y,z

[extruder]
step_pin: tool0: PD0
dir_pin: !tool0: PD1
enable_pin: !tool0: PD2
heater_pin: tool0: PB13
sensor_pin: tool0: PA3
sensor_type: EPCOS 100K B57560G104F

full_steps_per_rotation: 200
microsteps: 32
rotation_distance: 4.5929511432
nozzle_diameter: 0.400
filament_diameter: 1.750

control: pid

pid_Kp: 38.790
pid_Ki: 17.239
pid_Kd: 21.820

min_temp: 0
max_temp: 300

max_extrude_only_distance: 105

[tmc2209 extruder]
uart_pin: tool0: PA15
run_current: 0.6
stealthchop_threshold: 0
interpolate: false
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[heater_fan T0_hotend_fan]
pin: tool0: PA0
heater: extruder
heater_temp: 50.0

[fan_generic T0_partfan]
pin: tool0: PA1

[gcode_macro T0]
variable_color: ""
gcode:
  SELECT_TOOL T=0


[tool T0]
tool_number: 0
extruder: extruder
fan: T0_partfan

params_park_x: 8.0
params_park_y: 1
params_park_z: 295

params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 53.8
params_input_shaper_damping_ratio_x: 0.01
params_input_shaper_type_y: 'mzv'
params_input_shaper_freq_y: 39.6
params_input_shaper_damping_ratio_y: 0.01  

[resonance_tester]
accel_chip: adxl345
probe_points:
    175, 175, 20 #for 350mm beds

[tool_probe T0]
pin: tool0:PB6
tool: 0
x_offset: 0
y_offset: 0
z_offset = -1.020
samples: 3
speed: 5.0
samples_result: median
sample_retract_dist: 2.0
samples_tolerance: 0.02
samples_tolerance_retries: 3
activate_gcode:
  _TAP_PROBE_ACTIVATE HEATER=extruder